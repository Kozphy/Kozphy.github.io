name: Site checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate HTML
        run: npx --yes html-validate@9 "*.html"
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/projects-data.js
          node --check assets/js/main.js
          node --check assets/js/case-model.js
          node --check assets/js/portfolio.js
          node --check assets/js/waitlist.js
          node --check assets/js/validate-events.js
          node --check assets/js/recon-core.js
          node --check assets/js/recon-demo.js
      - name: Validate nested HTML
        run: npx --yes html-validate@9 "career/*.html" "checktrail/*.html"
      - name: Verify case calculations and scenario exports
        run: node --test tests/case-model.test.cjs
      - name: Verify recon demo core (cardinality, sign-off gate, SHA-256)
        run: node --test tests/recon-demo.test.cjs
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}
            --exclude 'linkedin\.com'
            --exclude 'img\.shields\.io'
            --max-retries 3
            '*.html'
